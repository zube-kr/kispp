<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KISPP 과학실 · B 교과서 사이드바형</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --ink: #1f2533; --sub: #667085; --line: #e7eaf0; --soft: #f6f8fb; --accent: #5cb531; --navy: #1b2a8f; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Pretendard, "Noto Sans KR", sans-serif; color: var(--ink); background: #fff; }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }

  .layout { display: grid; grid-template-columns: 290px 1fr; min-height: 100vh; }
  aside { background: var(--soft); border-right: 1px solid var(--line); padding: 26px 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { padding: 0 8px 22px; }
  .brand .school { font-size: 12px; color: var(--sub); letter-spacing: .5px; }
  .brand h1 { font-size: 24px; letter-spacing: -.8px; margin-top: 4px; }
  .brand h1 span { color: var(--accent); }

  .home { display: flex; justify-content: space-between; align-items: center; width: 100%; background: var(--navy); color: #fff; padding: 14px 18px; border-radius: 12px; font-weight: 700; margin-bottom: 14px; }
  .grade { margin-bottom: 8px; }
  .grade > button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 13px 14px; border-radius: 12px; background: #fff; border: 1px solid var(--line); font-weight: 700; font-size: 16px; }
  .grade > button .dot { width: 26px; height: 26px; border-radius: 8px; color: #fff; display: grid; place-items: center; font-size: 13px; }
  .grade > button .arr { margin-left: auto; transition: .2s; color: var(--sub); }
  .grade.open > button { border-color: currentColor; }
  .grade.open > button .arr { transform: rotate(180deg); }
  .grade ul { list-style: none; display: none; padding: 6px 0 6px 10px; }
  .grade.open ul { display: block; }
  .grade li button { width: 100%; text-align: left; padding: 9px 12px; border-radius: 8px; font-size: 14.5px; color: #3b4455; display: flex; gap: 8px; }
  .grade li button b { width: 22px; color: var(--sub); font-weight: 700; }
  .grade li button:hover { background: #eef1f6; }
  .grade li button.on { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.08); color: var(--ink); font-weight: 700; }
  .extra { margin-top: 14px; border: 1px dashed #c9d2e3; border-radius: 12px; padding: 13px 16px; font-weight: 700; width: 100%; text-align: left; }

  main { padding: 34px 44px 60px; max-width: 1050px; }
  .crumb { font-size: 13px; color: var(--sub); }
  .top { display: flex; gap: 28px; align-items: stretch; margin: 14px 0 30px; }
  .cover { width: 170px; flex-shrink: 0; border-radius: 10px; padding: 18px 16px; color: #fff; display: flex; flex-direction: column; justify-content: space-between; min-height: 220px; box-shadow: 0 10px 22px rgba(0,0,0,.12); position: relative; overflow: hidden; }
  .cover::after { content: ""; position: absolute; right: -40px; bottom: -40px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,.18); }
  .cover small { font-size: 11px; opacity: .9; }
  .cover strong { font-size: 30px; letter-spacing: -1px; }
  .info { flex: 1; border: 1px solid var(--line); border-radius: 18px; padding: 24px 26px; }
  .info .pill { display: inline-block; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 99px; color: #fff; }
  .info h2 { font-size: 30px; letter-spacing: -1px; margin: 10px 0; }
  .info p { color: var(--sub); line-height: 1.7; }
  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px; }
  .actions button { border: 1px solid var(--line); border-radius: 12px; padding: 14px 8px; font-weight: 700; font-size: 14px; background: #fff; }
  .actions button span { display: block; font-size: 22px; margin-bottom: 4px; }
  .actions button:hover { background: var(--soft); }

  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .tabs button { padding: 12px 16px; font-weight: 600; color: var(--sub); border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--ink); border-color: var(--ink); }
  .list { list-style: none; }
  .list li { display: flex; align-items: center; gap: 14px; padding: 15px 6px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #fff; flex-shrink: 0; }
  .list li .t { flex: 1; }
  .list li .d { color: #9aa2b1; font-size: 13px; }

  .menu-btn { display: none; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; }
    main { padding: 24px 18px 50px; }
    .top { flex-direction: column; }
    .cover { width: 100%; min-height: 110px; }
    .actions { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand"><div class="school">프놈펜한국국제학교</div><h1>KISPP <span>과학</span> 자료실</h1></div>
    <button class="home">연간 공통 자료 <span>›</span></button>
    <div id="nav"></div>
    <button class="extra">🎮 쉬어가는 과학 게임</button>
    <button class="extra">📖 방명록</button>
  </aside>

  <main>
    <div class="crumb" id="crumb"></div>
    <div class="top">
      <div class="cover" id="cover"></div>
      <div class="info">
        <span class="pill" id="pill"></span>
        <h2 id="uTitle"></h2>
        <p id="uDesc"></p>
        <div class="actions">
          <button><span>📘</span>개념 정리</button>
          <button><span>🧪</span>탐구 실험</button>
          <button><span>🕹️</span>시뮬레이션</button>
          <button><span>✏️</span>형성 평가</button>
        </div>
      </div>
    </div>

    <div class="tabs"><button class="on">전체</button><button>수업 PPT</button><button>활동지</button><button>영상</button><button>평가</button></div>
    <ul class="list" id="list"></ul>
  </main>
</div>

<script src="units.js"></script>
<script>
  const nav = document.getElementById('nav');
  const roman = ['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ','Ⅷ'];
  let cur = { g: 1, u: 0 };

  function renderNav() {
    nav.innerHTML = GRADES.map((g, gi) => `
      <div class="grade ${gi === cur.g ? 'open' : ''}" style="color:${g.color}">
        <button onclick="toggle(${gi})"><span class="dot" style="background:${g.color}">${gi + 1}</span>
          <span style="color:var(--ink)">${g.title}</span><span class="arr">⌄</span></button>
        <ul>${g.units.map((u, ui) => `<li><button class="${gi === cur.g && ui === cur.u ? 'on' : ''}" onclick="pick(${gi},${ui})"><b>${roman[ui]}.</b>${u.title}</button></li>`).join('')}</ul>
      </div>`).join('');
  }
  function toggle(gi) { cur = { g: gi, u: 0 }; render(); }
  function pick(gi, ui) { cur = { g: gi, u: ui }; render(); }

  function render() {
    const g = GRADES[cur.g], u = g.units[cur.u], d = DOMAINS[u.domain];
    renderNav();
    document.getElementById('crumb').textContent = `홈 › ${g.title} › ${roman[cur.u]}. ${u.title}`;
    document.getElementById('cover').style.background = g.color;
    document.getElementById('cover').innerHTML = `<small>중학교 · 2022 개정</small><strong>과학 ${cur.g + 1}</strong><small>KISPP SCIENCE</small>`;
    const pill = document.getElementById('pill');
    pill.textContent = `${roman[cur.u]}단원 · ${d.name}`; pill.style.background = d.color;
    document.getElementById('uTitle').textContent = u.title;
    document.getElementById('uDesc').textContent = u.desc;
    const items = [
      ['P', '#e0662c', `${u.title} 도입 수업 PPT`],
      ['W', '#2f7de1', `${u.title} 개념 활동지`],
      ['▶', '#e53935', `${u.title} 핵심 개념 영상`],
      ['S', '#5cb531', `${u.title} 탐구 실험 안내서`],
      ['Q', '#8a5bd6', `${u.title} 형성 평가 문제`]
    ];
    document.getElementById('list').innerHTML = items.map(([t, c, name], i) =>
      `<li><span class="ico" style="background:${c}">${t}</span><span class="t">${name}</span><span class="d">2026.09.${String(20 + i).padStart(2, '0')}</span></li>`).join('');
  }
  render();
</script>
</body>
</html>
