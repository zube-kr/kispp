<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KISPP 과학실 · D 노선도형</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --ink: #1c2230; --sub: #6a7283; --line: #e6e9ef; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Pretendard, "Noto Sans KR", sans-serif; color: var(--ink);
    background: #fff;
    background-image: linear-gradient(#f1f4f8 1px, transparent 1px), linear-gradient(90deg, #f1f4f8 1px, transparent 1px);
    background-size: 28px 28px;
  }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 22px; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 22px 0; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
  .logo i { display: flex; gap: 3px; }
  .logo i b { width: 8px; height: 26px; border-radius: 4px; }
  header nav { display: flex; gap: 8px; }
  header nav a { font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 99px; background: #fff; border: 1px solid var(--line); }

  .hero { padding: 30px 0 26px; display: flex; justify-content: space-between; align-items: end; gap: 20px; flex-wrap: wrap; }
  .hero h1 { font-size: 40px; letter-spacing: -1.5px; line-height: 1.25; }
  .hero h1 span { background: linear-gradient(transparent 60%, #d9f1cc 60%); }
  .hero p { color: var(--sub); margin-top: 10px; }
  .board { background: var(--ink); color: #ffd23f; font-family: ui-monospace, monospace; padding: 12px 18px; border-radius: 10px; font-size: 14px; min-width: 300px; }
  .board small { display: block; color: #9aa3b5; font-size: 11px; margin-bottom: 3px; font-family: Pretendard, sans-serif; }

  .map { background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 28px 28px 10px; box-shadow: 0 12px 30px rgba(20,30,60,.05); }
  .line { display: grid; grid-template-columns: 110px 1fr; align-items: start; margin-bottom: 34px; }
  .badge { display: flex; align-items: center; gap: 8px; font-weight: 800; margin-top: 4px; }
  .badge b { width: 38px; height: 38px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-size: 15px; }
  .badge span { font-size: 13px; color: var(--sub); line-height: 1.2; }
  .track { position: relative; display: flex; justify-content: space-between; }
  .track::before { content: ""; position: absolute; left: 12px; right: 12px; top: 17px; height: 10px; border-radius: 5px; background: var(--c); }
  .st { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 4px; }
  .st .dot { width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 5px solid var(--c); display: grid; place-items: center; font-size: 12px; font-weight: 800; transition: .15s; position: relative; z-index: 1; }
  .st .nm { margin-top: 8px; font-size: 13.5px; font-weight: 700; line-height: 1.35; max-width: 110px; }
  .st:hover .dot { transform: scale(1.15); }
  .st.on .dot { background: var(--c); color: #fff; transform: scale(1.25); box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 22%, transparent); }
  .st.end .dot { border-radius: 10px; }

  .panel { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 14px; margin: 22px 0 60px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px; }
  .card.main { border: 2px solid var(--c); }
  .card .k { font-size: 12px; font-weight: 800; color: var(--sub); letter-spacing: 1px; }
  .card h2 { font-size: 26px; letter-spacing: -1px; margin: 6px 0 8px; }
  .card h3 { font-size: 18px; margin-top: 6px; }
  .card p { color: var(--sub); line-height: 1.65; font-size: 15px; }
  .card .go { display: inline-block; margin-top: 14px; background: var(--c); color: #fff; font-weight: 700; padding: 11px 18px; border-radius: 10px; }
  .card.nav { cursor: pointer; }
  .card.nav:hover { background: #fafbfd; }
  .tags { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .tags span { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: #f1f3f7; }

  footer { text-align: center; color: var(--sub); font-size: 13px; padding-bottom: 40px; }

  @media (max-width: 820px) {
    header nav { display: none; }
    .hero h1 { font-size: 30px; }
    .map { padding: 20px 16px; }
    .line { grid-template-columns: 1fr; gap: 12px; }
    .track { flex-direction: column; gap: 14px; padding-left: 4px; }
    .track::before { left: 16px; right: auto; top: 10px; bottom: 10px; width: 10px; height: auto; }
    .st { flex-direction: row; text-align: left; gap: 12px; }
    .st .nm { margin: 0; max-width: none; }
    .panel { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><i><b style="background:#5cb531"></b><b style="background:#2f7de1"></b><b style="background:#f08a24"></b></i>KISPP 과학 노선도</div>
    <nav><a href="#">실험실</a><a href="#">과학 게임</a><a href="#">방명록</a><a href="https://www.kispp.net/" target="_blank" rel="noopener">학교 홈페이지 ↗</a></nav>
  </header>

  <div class="hero">
    <div>
      <h1>오늘은 <span>어느 역</span>에서 내릴까요?</h1>
      <p>프놈펜한국국제학교 중학교 과학 · 학년별 노선을 따라 단원 역에 들러보세요.</p>
    </div>
    <div class="board" id="board"></div>
  </div>

  <div class="map" id="map"></div>
  <div class="panel" id="panel"></div>

  <footer>프놈펜한국국제학교 과학과 · 2022 개정 교육과정</footer>
</div>

<script src="../data/units.js"></script>
<script>
  let cur = [0, 0];
  function go(g, u) { cur = [g, u]; render(); }

  function render() {
    document.getElementById('map').innerHTML = GRADES.map((g, gi) => `
      <div class="line" style="--c:${g.color}">
        <div class="badge"><b style="background:${g.color}">${gi + 1}</b><span>${g.label} 호선<br>${g.units.length}개 역</span></div>
        <div class="track">${g.units.map((u, ui) => `
          <button class="st ${ui === 0 || ui === g.units.length - 1 ? 'end' : ''} ${cur[0] === gi && cur[1] === ui ? 'on' : ''}" onclick="go(${gi},${ui})">
            <span class="dot">${ui + 1}</span><span class="nm">${u.title}</span></button>`).join('')}
        </div>
      </div>`).join('');

    const g = GRADES[cur[0]], u = g.units[cur[1]];
    const prev = g.units[cur[1] - 1], next = g.units[cur[1] + 1];
    document.getElementById('board').innerHTML =
      `<small>이번 역</small>${g.label} ${cur[1] + 1}번 · ${u.title}${next ? ` → 다음 ${next.title}` : ' (종점)'}`;
    const nav = (x, i, label) => x
      ? `<div class="card nav" onclick="go(${cur[0]},${i})"><div class="k">${label}</div><h3>${x.title}</h3><p>${cur[0] + 1}호선 ${i + 1}번 역</p></div>`
      : `<div class="card"><div class="k">${label}</div><h3>${label === '이전 역' ? '출발역입니다' : '종점입니다'}</h3><p>${g.title} 과정을 한눈에 돌아보세요.</p></div>`;
    document.getElementById('panel').style.setProperty('--c', g.color);
    document.getElementById('panel').innerHTML = nav(prev, cur[1] - 1, '이전 역') + `
      <div class="card main"><div class="k">${g.title} · ${cur[1] + 1}번 역 · ${DOMAINS[u.domain].name}</div>
        <h2>${u.title}</h2><p>${u.desc}</p>
        <div class="tags"><span>📘 개념</span><span>🧪 실험</span><span>🕹️ 시뮬레이션</span><span>✏️ 퀴즈</span></div>
        <a class="go" href="#">이 역에서 내리기 →</a></div>` + nav(next, cur[1] + 1, '다음 역');
  }
  render();
</script>
</body>
</html>
